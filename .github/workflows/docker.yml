name: Docker Image

on:
  pull_request:
    paths:
      - src/**
      - package.json
      - bun.lock
      - tsconfig.json
      - Dockerfile
      - .dockerignore
      - docker/**
      - scripts/**
      - README.md
      - config.example.yml
      - .github/workflows/docker.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - bun.lock
      - tsconfig.json
      - Dockerfile
      - .dockerignore
      - docker/**
      - scripts/**
      - README.md
      - config.example.yml
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release pipeline inputs
        run: bun run verify:full

      - name: Build compiled binary
        run: bun run build:binary

      - name: Smoke compiled binary
        run: bun run smoke:binary

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: knock-linux-x64
          path: dist/knock-linux-x64

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KNOCK_IMAGE_TAG: knock:ci
      KNOCK_IMAGE_MAX_SIZE_MB: 450
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build and size-check image
        run: bun run image:prepare

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 凭据来自 Infisical 而非 GitHub secrets：OIDC machine identity 绑定
      # repo:ignimutos/knock，action 会注入 DOCKERHUB_USER / DOCKERHUB_TOKEN 等
      # job 级环境变量，仓库内不保留长时凭据。
      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG || 'dev' }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH || '/' }}
          recursive: ${{ vars.INFISICAL_RECURSIVE || 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USER }}/knock
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push image for main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Hub README exists
        run: test -s docker/README.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USER }}/knock
          short-description: Knock is a Bun + TypeScript subscription fetch and delivery daemon.
          readme-filepath: ./docker/README.md

  notify:
    if: always()
    needs:
      - verify
      - image
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Telegram 凭据同样来自 Infisical（见 publish job 注释）。
      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG || 'dev' }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH || '/' }}
          recursive: ${{ vars.INFISICAL_RECURSIVE || 'true' }}

      - name: Telegram Notify
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ env.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ env.TELEGRAM_CHAT_ID }}
          status: ${{ (needs.verify.result == 'success' && needs.image.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')) && 'success' || 'failure' }}
          notify_fields: "actor,repository,workflow,branch,commit"
