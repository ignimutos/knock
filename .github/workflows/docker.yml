name: Docker Image

on:
  pull_request:
    paths:
      - src/**
      - package.json
      - bun.lock
      - tsconfig.json
      - Dockerfile
      - .dockerignore
      - docker/**
      - scripts/**
      - README.md
      - config.example.yml
      - .github/workflows/docker.yml
      - .github/actions/**
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - bun.lock
      - tsconfig.json
      - Dockerfile
      - .dockerignore
      - docker/**
      - scripts/**
      - README.md
      - config.example.yml
      - .github/workflows/docker.yml
      - .github/actions/**
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release pipeline inputs
        run: bun run verify:full

      - name: Build compiled binary
        run: bun run build:binary

      - name: Smoke compiled binary
        run: bun run smoke:binary

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: knock-linux-x64
          path: dist/knock-linux-x64

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KNOCK_IMAGE_TAG: knock:ci
      KNOCK_IMAGE_MAX_SIZE_MB: 450
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build and size-check image
        run: bun run image:prepare

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 凭据来自 Infisical 而非 GitHub secrets：OIDC machine identity 绑定
      # repo:ignimutos/knock。注入逻辑集中在 .github/actions/load-secrets，
      # 未配置 INFISICAL_IDENTITY_ID / INFISICAL_PROJECT_SLUG 时整步跳过。
      # vars 只在 workflow 表达式里展开并作为 inputs 传入；composite manifest
      # 不直接引用 vars（见 load-secrets/action.yml 注释）。
      - name: Load secrets from Infisical
        uses: ./.github/actions/load-secrets
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH }}
          recursive: ${{ vars.INFISICAL_RECURSIVE }}

      # 仓库 secrets 覆盖层：本步在 Infisical 之后运行，写 GITHUB_ENV 覆盖注入值；
      # 未用 Infisical 时，仅凭 repo secrets 也能发布。
      - name: Overlay repo secrets
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for name in DOCKERHUB_USER DOCKERHUB_TOKEN; do
            if [ -n "${!name:-}" ]; then
              printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USER }}/knock
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push image for main
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Hub README exists
        run: test -s docker/README.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USER }}/knock
          short-description: Knock is a Bun + TypeScript subscription fetch and delivery daemon.
          readme-filepath: ./docker/README.md

  notify:
    if: always()
    needs:
      - verify
      - image
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Telegram 凭据同样来自 Infisical（见 publish job 注释）。
      - name: Load secrets from Infisical
        uses: ./.github/actions/load-secrets
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH }}
          recursive: ${{ vars.INFISICAL_RECURSIVE }}

      # 仓库 secrets 覆盖层：本步在 Infisical 之后运行，写 GITHUB_ENV 覆盖注入值；
      # 未用 Infisical 时，仅凭 repo secrets 也能通知。
      - name: Overlay repo secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -n "${!name:-}" ]; then
              printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
            fi
          done

      - name: Telegram Notify
        uses: proDreams/actions-telegram-notifier@v3
        with:
          token: ${{ env.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ env.TELEGRAM_CHAT_ID }}
          status: ${{ (needs.verify.result == 'success' && needs.image.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')) && 'success' || 'failure' }}
          notify_fields: "actor,repository,workflow,branch,commit"
