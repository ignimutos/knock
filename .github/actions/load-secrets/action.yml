name: Load secrets
description: 可选地从 Infisical（OIDC）注入 CI secrets；未配置 identity 时跳过。

inputs:
  identity-id:
    description: Infisical machine identity ID；为空时整步跳过。
    required: false
    default: ""
  project-slug:
    description: Infisical project slug；为空时整步跳过。
    required: false
    default: ""
  env-slug:
    description: Infisical environment slug；留空时回退为 dev。
    required: false
    default: ""
  domain:
    description: Infisical 自定义域名；留空时回退为官方域名。
    required: false
    default: ""
  secret-path:
    description: Infisical secret path；留空时回退为 /project/knock。
    required: false
    default: ""
  recursive:
    description: 是否递归读取子路径；留空时回退为 false。
    required: false
    default: ""

runs:
  using: composite
  steps:
    # 未配置 Infisical identity 时整步跳过：无 Infisical 的仓库仍可运行。
    # 条件与取值全部走 inputs：composite manifest 不使用 vars 上下文，
    # 避免 runner 侧 manifest 加载阶段报 Unrecognized named-value: 'vars'。
    - name: Inject secrets from Infisical
      if: inputs.identity-id != '' && inputs.project-slug != ''
      uses: Infisical/secrets-action@v1.0.18
      with:
        method: oidc
        identity-id: ${{ inputs.identity-id }}
        project-slug: ${{ inputs.project-slug }}
        env-slug: ${{ inputs.env-slug || 'dev' }}
        domain: ${{ inputs.domain || 'https://app.infisical.com' }}
        secret-path: ${{ inputs.secret-path || '/project/knock' }}
        recursive: ${{ inputs.recursive || 'false' }}
